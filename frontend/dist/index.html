<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>McpNet</title>
    <script>
      (() => {
        const pending = [];
        const maxMessageLength = 12000;
        const report = (message) => {
          pending.push(String(message).slice(0, maxMessageLength));
          flush();
        };
        const flush = () => {
          const runtime = window.runtime;
          if (!runtime || typeof runtime.LogError !== 'function') return;
          while (pending.length) runtime.LogError(`[startup-ui] ${pending.shift()}`);
          clearInterval(flushTimer);
        };

        window.addEventListener('error', (event) => {
          const stack = event.error && event.error.stack ? `\n${event.error.stack}` : '';
          report(`JavaScript error: ${event.message || event.type}${stack}`);
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason && event.reason.stack ? event.reason.stack : String(event.reason);
          report(`Unhandled promise rejection: ${reason}`);
        });
        document.addEventListener('DOMContentLoaded', () => report('HTML DOMContentLoaded'));
        window.addEventListener('load', () => report('Browser load event'));

        const flushTimer = setInterval(flush, 250);
        setTimeout(() => clearInterval(flushTimer), 10 * 60 * 1000);
      })();
    </script>
